<section class="max-w-5xl pb-10">
  <p class="text-xs font-bold uppercase tracking-[0.16em] text-amber-800">Compliance workspace</p>
  <h1 class="mt-2 font-serif text-4xl leading-tight sm:text-5xl">{{ heading }}</h1>
  <p class="mt-3 max-w-2xl text-base leading-7 text-amber-950/70">{{ description }}</p>

  <section class="mt-8 border border-amber-300 bg-amber-50 p-6">
    <h2 class="font-serif text-2xl">Read-only workspace</h2>
    <p class="mt-2 max-w-2xl text-sm leading-6 text-amber-950/75">Compliance records will appear here when the compliance service is connected. Policy and claim monitoring remains subject to each service's read-only permissions.</p>
    <div class="mt-5 flex flex-wrap gap-3">
      <a routerLink="/compliance/notifications" class="border border-amber-900 px-4 py-2 text-sm font-bold text-amber-950">Notifications</a>
      <a routerLink="/compliance/profile" class="border border-amber-900 px-4 py-2 text-sm font-bold text-amber-950">Compliance profile</a>
    </div>
  </section>
</section>
